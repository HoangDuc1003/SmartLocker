<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#2b3a55">
    <title>Locker map</title>
    <link rel="stylesheet" href="../css/app.css">
    <link rel="stylesheet" href="../css/locker-map.css">
</head>
<body>
<div id="nav"></div>

<!-- The real page is the same markup with data-source="api" and data-api="${ctx}/api/locker-map" -->
<main id="lockerApp" data-source="mock"
      data-alert-url="#alert" data-ticket-url="#ticket">
    <p class="app-loading">Loading locker map…</p>
</main>

<script src="mock-data.js"></script>
<script src="demo.js"></script>
<script src="mock-locker.js"></script>
<script src="../js/app.js"></script>
<script>
(function () {
    if (!DEMO.page({ perm: 'MAP_VIEW', nav: 'map', into: 'lockerApp' })) { return; }
    var user = DEMO.me();
    LOCKER_MOCK.setMe(user.username);
    document.getElementById('lockerApp').setAttribute('data-role', user.role);
    // the map script reads data-role when it starts, so it is added only now
    var script = document.createElement('script');
    script.src = '../js/locker-map.js';
    document.body.appendChild(script);
})();
</script>
</body>
</html>
