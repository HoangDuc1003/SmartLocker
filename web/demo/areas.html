<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#2b3a55">
    <title>Locker areas</title>
    <link rel="stylesheet" href="../css/app.css">
</head>
<body>
<div id="nav"></div>
<div class="wrap" id="content">
    <h2>Locker areas</h2>
    <div class="tablewrap"><table class="grid" id="grid"></table></div>

    <div id="formBox" hidden>
        <h3 id="formTitle">Add an area</h3>
        <div class="error" id="error" hidden></div>
        <form class="form narrow" id="areaForm" novalidate>
            <label for="code">Code *</label>
            <input type="text" id="code" name="code" required maxlength="16" pattern="[A-Z0-9]{2,16}"
                   title="2 to 16 capital letters or digits" placeholder="LIB">

            <label for="name">Name *</label>
            <input type="text" id="name" name="name" required maxlength="150">

            <label for="note">Note</label>
            <input type="text" id="note" name="note" maxlength="400">

            <label class="inline"><input type="checkbox" id="active" name="active" checked> This area is in use</label>

            <div class="actions">
                <button type="submit">Save</button>
                <a class="btn ghost" href="areas.html">Cancel</a>
            </div>
        </form>
    </div>
</div>

<script src="mock-data.js"></script>
<script src="demo.js"></script>
<script src="../js/app.js"></script>
<script>
(function () {
    if (!DEMO.page({ perm: 'AREA_VIEW', nav: 'areas' })) { return; }

    var manage = DEMO.can('AREA_MANAGE');
    var list = DEMO.areas();
    var editing = '';                  // code of the area in the form, empty when adding
    var form = document.getElementById('areaForm');
    var error = document.getElementById('error');

    function render() {
        var users = DEMO.users();
        var html = '<tr><th>Code</th><th>Name</th><th>Note</th><th class="c">Slots</th>' +
                   '<th class="c">Users</th><th class="c">State</th><th>Actions</th></tr>';
        list.forEach(function (a) {
            var count = users.filter(function (u) { return u.area === a.code; }).length;
            html += '<tr class="' + (a.active ? '' : 'locked') + '"><td>' + DEMO.esc(a.code) + '</td><td>' + DEMO.esc(a.name) + '</td>' +
                    '<td>' + DEMO.esc(a.note) + '</td><td class="c">' + a.slots + '</td><td class="c">' + count + '</td>' +
                    '<td class="c">' + (a.active ? 'In use' : 'Stopped') + '</td><td class="ops">' +
                    (a.slots ? '<a href="map.html?area=' + encodeURIComponent(a.code) + '">Map</a>' : '') +
                    (manage ? '<button type="button" class="link" data-act="edit" data-code="' + DEMO.esc(a.code) + '">Edit</button>' +
                              '<button type="button" class="link danger" data-act="delete" data-code="' + DEMO.esc(a.code) + '">Delete</button>' : '') +
                    '</td></tr>';
        });
        document.getElementById('grid').innerHTML = html;
        SmartLocker.labelCells(document.getElementById('grid').parentNode);
    }

    function find(code) {
        for (var i = 0; i < list.length; i++) { if (list[i].code === code) { return i; } }
        return -1;
    }

    document.getElementById('grid').addEventListener('click', function (e) {
        var act = e.target.getAttribute('data-act');
        var index = find(e.target.getAttribute('data-code'));
        if (!act || index < 0) { return; }
        var a = list[index];

        if (act === 'edit') {
            editing = a.code;
            form.code.value = a.code;
            form.name.value = a.name;
            form.note.value = a.note;
            form.active.checked = a.active;
            document.getElementById('formTitle').textContent = 'Edit area ' + a.code;
            error.hidden = true;
            document.getElementById('formBox').scrollIntoView();
        } else {
            // same rule as the DAO: an area that is still referenced cannot go
            var users = DEMO.users().filter(function (u) { return u.area === a.code; }).length;
            if (users || a.slots) {
                SmartLocker.toast('Cannot delete ' + a.code + ': ' + a.slots + ' locker slots and ' + users + ' users still use it', 'error');
                return;
            }
            if (!window.confirm('Delete the area ' + a.code + '?')) { return; }
            list.splice(index, 1);
            DEMO.saveAreas(list);
            DEMO.audit('DELETE', 'LockerArea', index + 1, a.code + ' removed');
            SmartLocker.toast('Area ' + a.code + ' deleted', 'success');
            render();
        }
    });

    if (manage) {
        document.getElementById('formBox').hidden = false;
        form.addEventListener('submit', function (e) {
            e.preventDefault();
            var code = form.code.value.trim().toUpperCase();
            var problems = [];
            if (!/^[A-Z0-9]{2,16}$/.test(code)) { problems.push('Code must be 2 to 16 capital letters or digits'); }
            if (form.name.value.trim().length < 2) { problems.push('Name must have at least 2 characters'); }
            if (code !== editing && find(code) >= 0) { problems.push('Code ' + code + ' already exists'); }
            if (problems.length) {
                error.innerHTML = '<ul>' + problems.map(function (p) { return '<li>' + DEMO.esc(p) + '</li>'; }).join('') + '</ul>';
                error.hidden = false;
                return;
            }
            var values = { code: code, name: form.name.value.trim(), note: form.note.value.trim(), active: form.active.checked };
            var index = find(editing);
            if (index >= 0) {
                var old = list[index].code;
                if (old !== code) {   // users follow the renamed code
                    var users = DEMO.users();
                    users.forEach(function (u) { if (u.area === old) { u.area = code; } });
                    DEMO.saveUsers(users);
                }
                values.slots = list[index].slots;
                list[index] = values;
                DEMO.audit('UPDATE', 'LockerArea', index + 1, code + ' updated');
                DEMO.flash('Area ' + code + ' saved');
            } else {
                values.slots = 0;
                list.push(values);
                DEMO.audit('CREATE', 'LockerArea', list.length, code + ' created');
                DEMO.flash('Area ' + code + ' created');
            }
            DEMO.saveAreas(list);
            window.location.href = 'areas.html';
        });
    }

    render();
})();
</script>
</body>
</html>
