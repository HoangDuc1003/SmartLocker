<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#2b3a55">
    <title>Users</title>
    <link rel="stylesheet" href="../css/app.css">
</head>
<body>
<div id="nav"></div>
<div class="wrap" id="content">
    <h2 id="title">Users</h2>

    <form class="filter" method="get" action="users.html" id="filter">
        <input type="text" name="keyword" placeholder="Username, full name or email">
        <select name="role"></select>
        <select name="area"></select>
        <select name="state">
            <option value="">-- All states --</option>
            <option value="ACTIVE">Active</option>
            <option value="LOCKED">Locked</option>
        </select>
        <button type="submit">Filter</button>
        <a class="btn ghost" href="users.html">Clear</a>
        <span id="tools"></span>
    </form>

    <div class="tablewrap"><table class="grid" id="grid"></table></div>
    <div id="pager"></div>
</div>

<script src="mock-data.js"></script>
<script src="demo.js"></script>
<script src="../js/app.js"></script>
<script>
(function () {
    if (!DEMO.page({ perm: 'USER_VIEW', nav: 'users' })) { return; }

    var PAGE_SIZE = 8;
    var me = DEMO.me();
    var form = document.getElementById('filter');
    var f = { keyword: DEMO.qs('keyword'), role: DEMO.qs('role'), area: DEMO.qs('area'), state: DEMO.qs('state') };
    var page = parseInt(DEMO.qs('page'), 10) || 1;

    // filter controls
    var roleOptions = '<option value="">-- All roles --</option>';
    DEMO.data.roles.forEach(function (r) { roleOptions += '<option value="' + r.code + '">' + r.code + '</option>'; });
    form.role.innerHTML = roleOptions;
    var areaOptions = '<option value="">-- All areas --</option>';
    DEMO.areas().forEach(function (a) { areaOptions += '<option value="' + DEMO.esc(a.code) + '">' + DEMO.esc(a.code) + '</option>'; });
    form.area.innerHTML = areaOptions;
    form.keyword.value = f.keyword;
    form.role.value = f.role;
    form.area.value = f.area;
    form.state.value = f.state;

    // buttons the role is allowed to see
    var tools = '';
    if (DEMO.can('USER_CREATE')) { tools += '<a class="btn" href="user-form.html">Add user</a> '; }
    if (DEMO.can('REPORT_EXPORT')) { tools += '<button type="button" class="ghost btn" id="export">Export CSV</button>'; }
    document.getElementById('tools').innerHTML = tools;

    function filtered() {
        var key = f.keyword.toLowerCase();
        return DEMO.users().filter(function (u) {
            if (key && (u.username + ' ' + u.fullName + ' ' + u.email).toLowerCase().indexOf(key) === -1) { return false; }
            if (f.role && u.role !== f.role) { return false; }
            if (f.area && u.area !== f.area) { return false; }
            if (f.state === 'ACTIVE' && u.locked) { return false; }
            if (f.state === 'LOCKED' && !u.locked) { return false; }
            return true;
        });
    }

    function query(p) {
        return '?keyword=' + encodeURIComponent(f.keyword) + '&role=' + encodeURIComponent(f.role) +
               '&area=' + encodeURIComponent(f.area) + '&state=' + encodeURIComponent(f.state) + '&page=' + p;
    }

    function actions(u) {
        var html = '';
        var mine = u.id === me.id;
        var manage = DEMO.canManage(u);
        if (DEMO.can('USER_UPDATE') && (manage || mine)) { html += '<a href="user-form.html?id=' + u.id + '">Edit</a>'; }
        if (DEMO.can('USER_LOCK') && manage && !mine) {
            html += '<button type="button" class="link" data-act="lock" data-id="' + u.id + '">' + (u.locked ? 'Unlock' : 'Lock') + '</button>';
        }
        if (DEMO.can('USER_RESET_PW') && manage) { html += '<button type="button" class="link" data-act="reset" data-id="' + u.id + '">Reset password</button>'; }
        if (DEMO.can('USER_DELETE') && manage && !mine) { html += '<button type="button" class="link danger" data-act="delete" data-id="' + u.id + '">Delete</button>'; }
        return html;
    }

    function render() {
        var list = filtered();
        var pages = Math.max(1, Math.ceil(list.length / PAGE_SIZE));
        if (page > pages) { page = pages; }
        var rows = list.slice((page - 1) * PAGE_SIZE, page * PAGE_SIZE);

        document.getElementById('title').textContent = 'Users (' + list.length + ')';
        var html = '<tr><th>#</th><th>Username</th><th>Full name</th><th>Email</th><th>Role</th>' +
                   '<th>Area</th><th class="c">Status</th><th>Actions</th></tr>';
        rows.forEach(function (u) {
            html += '<tr class="' + (u.locked ? 'locked' : '') + '"><td>' + u.id + '</td><td>' + DEMO.esc(u.username) + '</td>' +
                    '<td>' + DEMO.esc(u.fullName) + '</td><td>' + DEMO.esc(u.email) + '</td>' +
                    '<td><span class="tag">' + DEMO.esc(u.role) + '</span></td><td>' + DEMO.esc(u.area) + '</td>' +
                    '<td class="c">' + (u.locked ? 'Locked' : 'Active') + '</td><td class="ops">' + actions(u) + '</td></tr>';
        });
        if (!rows.length) { html += '<tr><td colspan="8" class="c">No user matches the filter</td></tr>'; }
        document.getElementById('grid').innerHTML = html;
        document.getElementById('pager').innerHTML = DEMO.pager(list.length, page, PAGE_SIZE, query);
        SmartLocker.labelCells(document.getElementById('grid').parentNode);
    }

    function find(id) {
        var all = DEMO.users();
        for (var i = 0; i < all.length; i++) { if (all[i].id === id) { return { all: all, index: i }; } }
        return null;
    }

    document.getElementById('grid').addEventListener('click', function (e) {
        var act = e.target.getAttribute('data-act');
        if (!act) { return; }
        var hit = find(parseInt(e.target.getAttribute('data-id'), 10));
        if (!hit) { return; }
        var u = hit.all[hit.index];
        if (!DEMO.canManage(u) || u.id === me.id && act !== 'reset') { return; }   // the server repeats this check

        if (act === 'lock') {
            u.locked = !u.locked;
            DEMO.saveUsers(hit.all);
            DEMO.audit('LOCK', 'AppUser', u.id, u.username + (u.locked ? ' locked' : ' unlocked'));
            SmartLocker.toast(u.username + (u.locked ? ' is locked' : ' is unlocked'), 'success');
        } else if (act === 'reset') {
            if (!window.confirm('Reset the password of ' + u.username + ' to 123456?')) { return; }
            DEMO.audit('RESET', 'AppUser', u.id, 'Password reset for ' + u.username);
            SmartLocker.toast('Password of ' + u.username + ' is now 123456', 'success');
        } else if (act === 'delete') {
            if (!window.confirm('Delete the account ' + u.username + '?')) { return; }
            hit.all.splice(hit.index, 1);
            DEMO.saveUsers(hit.all);
            DEMO.audit('DELETE', 'AppUser', u.id, u.username + ' removed');
            SmartLocker.toast(u.username + ' deleted', 'success');
        }
        render();
    });

    var exportButton = document.getElementById('export');
    if (exportButton) {
        exportButton.addEventListener('click', function () {
            DEMO.csv('users.csv', ['id', 'username', 'full_name', 'email', 'phone', 'role', 'area', 'status'],
                filtered().map(function (u) {
                    return [u.id, u.username, u.fullName, u.email, u.phone, u.role, u.area, u.locked ? 'LOCKED' : 'ACTIVE'];
                }));
        });
    }

    render();
})();
</script>
</body>
</html>
