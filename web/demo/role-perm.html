<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#2b3a55">
    <title>Role permissions</title>
    <link rel="stylesheet" href="../css/app.css">
</head>
<body>
<div id="nav"></div>
<div class="wrap" id="content">
    <h2 id="title">Permissions</h2>
    <p>
        This list is every permission of the system. The SecurityFilter reads this table, so removing
        a tick closes the matching pages for that role immediately. To try it, untick a permission,
        save, then sign in as a user of that role.
    </p>

    <form id="permForm">
        <div class="tablewrap"><table class="grid" id="grid"></table></div>
        <div class="actions">
            <button type="submit">Save permissions</button>
            <a class="btn ghost" href="roles.html">Back</a>
        </div>
    </form>
</div>

<script src="mock-data.js"></script>
<script src="demo.js"></script>
<script src="../js/app.js"></script>
<script>
(function () {
    if (!DEMO.page({ perm: 'ROLE_MANAGE', nav: 'roles' })) { return; }

    var role = DEMO.roleOf(DEMO.qs('id'));
    if (!role) {
        document.getElementById('content').innerHTML = '<div class="error">Unknown role</div><a class="btn ghost" href="roles.html">Back</a>';
        return;
    }
    document.getElementById('title').textContent = 'Permissions of ' + role.code;

    var map = DEMO.perms();
    var granted = map[role.code] || [];
    // the Administrator keeps these two, otherwise nobody could give the permissions back
    var pinned = role.code === 'ADMIN' ? ['ROLE_VIEW', 'ROLE_MANAGE'] : [];

    var html = '<tr><th class="c">Allowed</th><th>Code</th><th>Meaning</th><th>Group</th></tr>';
    var lastModule = '';
    DEMO.data.perms.forEach(function (p) {
        if (p.module !== lastModule) {
            html += '<tr class="group"><td colspan="4">' + p.module + '</td></tr>';
            lastModule = p.module;
        }
        var locked = pinned.indexOf(p.code) !== -1;
        html += '<tr><td class="c"><input type="checkbox" name="perm" value="' + p.code + '"' +
                (granted.indexOf(p.code) !== -1 || locked ? ' checked' : '') + (locked ? ' disabled' : '') + '></td>' +
                '<td><code>' + p.code + '</code></td><td>' + DEMO.esc(p.name) + '</td><td>' + p.module + '</td></tr>';
    });
    document.getElementById('grid').innerHTML = html;

    document.getElementById('permForm').addEventListener('submit', function (e) {
        e.preventDefault();
        var chosen = [];
        var boxes = document.querySelectorAll('input[name=perm]');
        for (var i = 0; i < boxes.length; i++) {
            if (boxes[i].checked) { chosen.push(boxes[i].value); }
        }
        map[role.code] = chosen;
        DEMO.savePerms(map);
        DEMO.audit('UPDATE', 'Role', DEMO.data.roles.indexOf(role) + 1, 'Permissions of ' + role.code + ' changed, ' + chosen.length + ' allowed');
        DEMO.flash('Permissions of ' + role.code + ' saved');
        window.location.href = 'roles.html';
    });
})();
</script>
</body>
</html>
