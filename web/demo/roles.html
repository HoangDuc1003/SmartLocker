<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#2b3a55">
    <title>Roles</title>
    <link rel="stylesheet" href="../css/app.css">
</head>
<body>
<div id="nav"></div>
<div class="wrap" id="content">
    <h2>Roles</h2>
    <p>
        A smaller rank number is a higher role. Except for the Administrator, a role can only add, edit,
        lock or reset accounts of a lower role. Permissions are rows in the database, so changing them here
        takes effect at once.
    </p>
    <div class="tablewrap"><table class="grid" id="grid"></table></div>
</div>

<script src="mock-data.js"></script>
<script src="demo.js"></script>
<script src="../js/app.js"></script>
<script>
(function () {
    if (!DEMO.page({ perm: 'ROLE_VIEW', nav: 'roles' })) { return; }

    var users = DEMO.users();
    var perms = DEMO.perms();
    var html = '<tr><th class="c">Rank</th><th>Code</th><th>Name</th><th class="c">Users</th>' +
               '<th class="c">Permissions</th><th>Note</th><th>Actions</th></tr>';
    DEMO.data.roles.forEach(function (r) {
        var count = users.filter(function (u) { return u.role === r.code; }).length;
        html += '<tr><td class="c">' + r.rank + '</td><td><span class="tag">' + r.code + '</span></td>' +
                '<td>' + DEMO.esc(r.name) + '</td><td class="c">' + count + '</td>' +
                '<td class="c">' + (perms[r.code] || []).length + ' / ' + DEMO.data.perms.length + '</td>' +
                '<td>' + DEMO.esc(r.note) + '</td><td class="ops">' +
                (DEMO.can('ROLE_MANAGE') ? '<a href="role-perm.html?id=' + r.code + '">Permissions</a>' : '') + '</td></tr>';
    });
    document.getElementById('grid').innerHTML = html;
})();
</script>
</body>
</html>
