<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#2b3a55">
    <title>Dashboard</title>
    <link rel="stylesheet" href="../css/app.css">
</head>
<body>
<div id="nav"></div>
<div class="wrap" id="content">
    <h2>Dashboard</h2>

    <div class="cards" id="lockerCards"></div>
    <div class="cards" id="userCards"></div>

    <h3>Users per role</h3>
    <canvas id="roleChart" width="720" height="240"></canvas>

    <h3>Locker areas</h3>
    <div class="tablewrap"><table class="grid" id="areaTable"></table></div>
</div>

<script src="mock-data.js"></script>
<script src="demo.js"></script>
<script src="mock-locker.js"></script>
<script src="../js/app.js"></script>
<script>
(function () {
    if (!DEMO.page({ perm: 'DASH_VIEW', nav: 'dashboard' })) { return; }

    function card(num, caption, warn) {
        return '<div class="card' + (warn ? ' warn' : '') + '"><div class="num">' + num +
               '</div><div class="cap">' + caption + '</div></div>';
    }

    // locker figures: free, in use, alerts and overdue slots of every area
    var total = { free: 0, used: 0, alert: 0, overdue: 0 };
    var rows = '<tr><th>Code</th><th>Area</th><th class="c">Free / total</th><th class="c">Alerts</th><th>Map</th></tr>';
    DEMO.areas().forEach(function (a) {
        var data = LOCKER_MOCK.get(a.code, 'ADMIN');
        var known = data.area.area_code === a.code;
        var free = 0, count = 0, alerts = 0;
        (known ? data.banks : []).forEach(function (bank) {
            bank.slots.forEach(function (s) {
                count++;
                if (s.status === 'AVAILABLE') { free++; total.free++; }
                if (s.status === 'OCCUPIED' || s.status === 'RESERVED' || s.status === 'OVERDUE') { total.used++; }
                if (s.status === 'OVERDUE') { total.overdue++; }
                if (s.status === 'ALERT') { alerts++; total.alert++; }
            });
        });
        rows += '<tr><td>' + DEMO.esc(a.code) + '</td><td>' + DEMO.esc(a.name) + '</td>' +
                '<td class="c">' + free + ' / ' + count + '</td>' +
                '<td class="c">' + (alerts ? '<span class="tag bad">' + alerts + '</span>' : '0') + '</td>' +
                '<td>' + (count ? '<a href="map.html?area=' + encodeURIComponent(a.code) + '">Open map</a>' : '') + '</td></tr>';
    });
    document.getElementById('areaTable').innerHTML = rows;

    document.getElementById('lockerCards').innerHTML =
        card(total.free, 'Free slots') + card(total.used, 'Slots in use') +
        card(total.overdue, 'Overdue slots', total.overdue > 0) + card(total.alert, 'Open alerts', total.alert > 0);

    // user figures
    var users = DEMO.users();
    var locked = users.filter(function (u) { return u.locked; }).length;
    var dayAgo = Date.now() - 24 * 3600 * 1000;
    var failures = DEMO.loginRows().filter(function (l) { return !l.ok && l.at.getTime() > dayAgo; }).length;
    document.getElementById('userCards').innerHTML =
        card(users.length, 'Total users') + card(DEMO.data.roles.length, 'Roles') +
        card(locked, 'Locked accounts') + card(failures, 'Failed logins in 24 hours');

    var labels = [], values = [];
    DEMO.data.roles.forEach(function (r) {
        labels.push(r.code);
        values.push(users.filter(function (u) { return u.role === r.code; }).length);
    });
    drawBars('roleChart', labels, values);
})();
</script>
</body>
</html>
